[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP service exposing the Go Pet Hospital REST API to AI Agents (stage 1: list_pets only)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pet Hospital MCP Teaching" }]
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.12",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
