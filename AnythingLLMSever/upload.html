<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传与向量化嵌入</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2937; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .ws { font-size: 13px; color: #6b7280; background: #f3f4f6; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; word-break: break-all; }
  .ws b { color: #111827; }
  label { display:block; font-size: 13px; color:#374151; margin-bottom: 6px; }
  input[type=file] { width: 100%; font-size: 13px; margin-bottom: 14px; }
  button { width: 100%; padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #result { margin-top: 16px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .ok { color: #047857; }
  .err { color: #b91c1c; }
  .muted { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>文档上传与向量化嵌入</h1>
    <div id="ws" class="ws">正在获取工作区…</div>
    <label for="file">选择文档文件</label>
    <input id="file" type="file" disabled>
    <button id="btn" disabled>上传并嵌入</button>
    <div id="result"></div>
    <p class="muted">仅本地演示用：API Key 内嵌于页面。</p>
  </div>

<script>
const API_BASE = "http://localhost:3001/api";
const API_KEY = "PMKKAJG-TZ9MCFM-Q028HXJ-806T09R";
const headers = { Authorization: "Bearer " + API_KEY };

const wsBox = document.getElementById("ws");
const fileInput = document.getElementById("file");
const btn = document.getElementById("btn");
const result = document.getElementById("result");
let workspaceSlug = null;

async function loadWorkspace() {
  try {
    const res = await fetch(API_BASE + "/v1/workspaces", { headers });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const ws = (data.workspaces || [])[0];
    if (!ws) throw new Error("未找到任何工作区");
    workspaceSlug = ws.slug;
    wsBox.innerHTML = "目标工作区：<b>" + escapeHtml(ws.name) + "</b><br>slug：" + escapeHtml(ws.slug);
    fileInput.disabled = false;
    btn.disabled = false;
  } catch (e) {
    wsBox.innerHTML = '<span class="err">获取工作区失败：' + escapeHtml(e.message) + "</span>";
  }
}

btn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) { result.innerHTML = '<span class="err">请先选择文件</span>'; return; }
  if (!workspaceSlug) { result.innerHTML = '<span class="err">工作区未就绪</span>'; return; }
  btn.disabled = true; fileInput.disabled = true;
  result.textContent = "处理中…（解析 + 向量化嵌入，请稍候）";
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("addToWorkspaces", workspaceSlug);
    const res = await fetch(API_BASE + "/v1/document/upload", { method: "POST", headers, body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) {
      throw new Error(data.error || data.reason || ("HTTP " + res.status));
    }
    const docs = data.documents || [];
    const lines = docs.map((d, i) =>
      (i + 1) + ". " + (d.title || d.name) +
      " | 字数：" + (d.wordCount ?? "-") +
      " | 估算 token：" + (d.token_count_estimate ?? "-") +
      " | 位置：" + (d.location || "-")
    );
    result.innerHTML = '<span class="ok">✅ 上传并完成向量化嵌入</span>\n\n' + escapeHtml(lines.join("\n"));
  } catch (e) {
    result.innerHTML = '<span class="err">上传失败：' + escapeHtml(e.message) + "</span>";
  } finally {
    btn.disabled = false; fileInput.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

loadWorkspace();
</script>
</body>
</html>
